<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Elysia</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        color: #2b2d3c;
        background: #f6f7fa;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      h1 {
        font-size: 40px;
        letter-spacing: -2px;
        margin: 12px;
      }
      p {
        color: #858493;
        font-size: 14px;
      }
      .mark {
        color: #7965cc;
        font-size: 54px;
      }
      .line {
        height: 3px;
        width: 180px;
        background: #e8e3f6;
        border-radius: 9px;
        margin: 25px auto;
      }
      .line:after {
        content: '';
        display: block;
        width: 70px;
        height: 3px;
        background: #7965cc;
        animation: move 1.4s ease-in-out infinite alternate;
      }
      @keyframes move {
        to {
          transform: translateX(110px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .line:after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark">✧</div>
    <h1>Elysia</h1>
    <p>正在准备你的本机工作台</p>
    <div class="line"></div>
    <p>连接服务 · 恢复任务 · 打开工作区</p>
  </body>
</html>
