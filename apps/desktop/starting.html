<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Elysia</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        color: #362b43;
        background: radial-gradient(ellipse at 50% 38%, #f3e1e7 0, #fcf6f2 45%, #faf8f5 75%);
        font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -1px;
        font-weight: 650;
        margin: 22px 0 6px;
      }
      p {
        color: #746f80;
        font-size: 13px;
        margin: 8px 0;
      }
      .mark {
        width: 112px;
        height: 112px;
        margin: auto;
        filter: drop-shadow(0 10px 16px #92536f18);
        animation: arrive 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      h1,
      p {
        animation: arrive 240ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .line {
        height: 3px;
        width: 136px;
        background: #e9d9e0;
        border-radius: 9px;
        overflow: hidden;
        margin: 28px auto 16px;
      }
      .line:after {
        content: '';
        display: block;
        width: 48px;
        height: 3px;
        background: #ba819d;
        animation: move 1.4s ease-in-out infinite alternate;
      }
      @keyframes move {
        to {
          transform: translateX(88px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        .line:after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img class="mark" src="../../assets/brand/app-icon.svg" width="112" height="112" alt="" />
    <h1>Elysia</h1>
    <p>把想法，慢慢做成喜欢的日常。</p>
    <div class="line" role="progressbar" aria-label="正在准备工作台"></div>
    <p role="status">正在连接本机服务</p>
  </body>
</html>
