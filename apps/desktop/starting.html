<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Elysia</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        color: #362b43;
        background: radial-gradient(ellipse at 50% 38%, #f6dce9 0, #fcf4f9 45%, #faf8fc 75%);
        font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -1px;
        font-weight: 650;
        margin: 22px 0 6px;
      }
      p {
        color: #746f80;
        font-size: 13px;
        margin: 8px 0;
      }
      .mark {
        width: 144px;
        height: 144px;
        margin: auto;
        filter: drop-shadow(0 12px 18px #9e4f7e20);
      }
      .line {
        height: 3px;
        width: 136px;
        background: #eed8e7;
        border-radius: 9px;
        overflow: hidden;
        margin: 28px auto 16px;
      }
      .line:after {
        content: '';
        display: block;
        width: 48px;
        height: 3px;
        background: #c779a6;
        animation: move 1.4s ease-in-out infinite alternate;
      }
      @keyframes move {
        to {
          transform: translateX(88px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .line:after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <img class="mark" src="../../assets/brand/app-icon.png" width="144" height="144" alt="" />
    <h1>Elysia</h1>
    <p>让每一个想法，如花般绽放。</p>
    <div class="line" role="progressbar" aria-label="正在准备工作台"></div>
    <p role="status">正在连接本机服务</p>
  </body>
</html>
