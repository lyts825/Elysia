<!--
  Web 应用入口：提供语言、视口、品牌图标和 React 根节点，根节点内先展示轻量启动界面。main.tsx 挂载后接管根节点；页面本身只引用入口模块，不承担任务状态或 API 逻辑。
  EN: Web application entry: defines language, viewport, brand icons, and the React root with lightweight startup content. main.tsx takes over after mounting; this document references the entry module without owning task state or API logic.
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#965d6b" />
    <link rel="stylesheet" href="/src/Startup.css" />
    <link rel="icon" type="image/svg+xml" href="../../assets/brand/app-icon.svg" />
    <link rel="alternate icon" href="../../assets/brand/app-icon.ico" />
    <link rel="apple-touch-icon" href="../../assets/brand/app-icon.png" />
    <title>Elysia · 本机 Agent 工作台</title>
  </head>
  <body>
    <!--
      React 加载前先显示轻量启动界面，挂载后由应用接管。
      EN: Shows a lightweight startup surface before React loads; the mounted application then takes over.
    -->
    <div id="root">
      <main class="startup-screen">
        <div class="startup-content">
          <div class="startup-visual startup-minimal" aria-hidden="true">
            <div class="startup-emblem"><span>E</span></div>
          </div>
          <h1>Elysia</h1>
          <p class="startup-status" role="status">正在准备工作台</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
