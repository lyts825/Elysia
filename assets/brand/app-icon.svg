<!--
  512×512 应用图标：圆角底板叠加玫瑰渐变和日光，再通过可复用 emblem 路径绘制花叶、丝带与细节。defs 中的渐变和阴影仅供本文件引用，变换把小坐标标识放大到图标画布，保持主体比例。
  EN: 512×512 application icon: layers rose/sunlight over a rounded tile, then draws the reusable emblem, foliage, ribbon, and details. Local defs provide gradients/shadow; transforms scale the small-coordinate mark while preserving its proportions.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Elysia · 花间日光</title>
<!--
  复用渐变、阴影与标识几何，use 仅引用本地 ID，避免不同尺寸图层重复维护花形。
  EN: Shares gradients, shadow, and emblem geometry through local IDs so differently scaled layers reuse the same flower shape.
-->
  <defs>
    <linearGradient id="rose" x1="80" y1="30" x2="405" y2="498" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ebc1b9"/><stop offset=".5" stop-color="#cf9b9f"/><stop offset="1" stop-color="#a8788b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(409 62) rotate(132) scale(395)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbe6" stop-opacity=".66"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="7" y1="3" x2="15" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf5"/><stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy=".18" stdDeviation=".25" flood-color="#775b63" flood-opacity=".18"/>
    </filter>
    <path id="emblem" d="M12 4.1C9.6 1.3 6.3 2.6 6.4 5.8C2.9 5.2 1.7 8.8 4.4 10.8C2.5 13.6 5.2 16.5 8.1 14.9C8.9 18.1 12.8 18.1 13.6 14.9C16.8 16.5 19.3 13.5 17.4 10.9C20.3 8.9 19 5.3 15.8 5.8C15.9 3.1 13.9 2.3 12 4.1ZM10.5 16.6C11.1 18.5 10.9 20.1 10.1 22.2L11.5 22.5C12.4 20.4 12.7 18.5 12 16.5ZM13 18.5C14.5 15.9 17.4 15.2 20.6 15.9C19.5 19 16.5 20.1 13 18.5ZM9.8 19.1C8.1 16.7 5.5 16.3 3 17.2C4.2 19.9 7.2 20.6 9.8 19.1Z"/>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#rose)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#sun)"/>
  <rect x="11" y="11" width="490" height="490" rx="113" fill="none" stroke="#fffaf0" stroke-opacity=".5" stroke-width="3"/>
  <g transform="translate(62 20) scale(17.5)">
    <use href="#emblem" fill="url(#petal)" filter="url(#soft)"/>
    <path d="M13 18.5C14.5 15.9 17.4 15.2 20.6 15.9C19.5 19 16.5 20.1 13 18.5ZM9.8 19.1C8.1 16.7 5.5 16.3 3 17.2C4.2 19.9 7.2 20.6 9.8 19.1Z" fill="#718b7d"/>
    <path d="M10.8 18.3C8.7 19.2 7.7 21 7.5 22.7L9.7 21.8L11 23.4C11.6 21.1 12.3 19.9 13.8 19.1C15 18.5 16.2 18.3 17.4 18.5C15.5 17.6 13.3 17.8 11.9 18.6Z" fill="#b8cdd4"/>
    <path d="M9.4 6.3C8.5 7.5 8.4 8.8 9.3 9.7M14.7 8.2C14.8 9.9 13.9 11 12.5 11.5M7.5 12C8.8 13.2 10.8 13.4 12 12.6" fill="none" stroke="#dac5bc" stroke-width=".5" stroke-linecap="round"/>
    <circle cx="10.9" cy="10" r="1.5" fill="#d7bd85"/>
    <circle cx="10.5" cy="9.55" r=".6" fill="#fff8d7"/>
  </g>
</svg>
