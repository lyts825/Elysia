<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysia · 品牌资产</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fbf9f1;
        color: #2e3935;
        font:
          14px/1.6 'Segoe UI',
          'Microsoft YaHei UI',
          sans-serif;
      }
      main {
        max-width: 1160px;
        margin: auto;
        padding: 48px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 32px;
        background: url('garden-light.svg') right top / 580px auto no-repeat;
      }
      header h1 {
        font-size: 30px;
        letter-spacing: -0.7px;
        margin: 4px 0;
      }
      header p {
        margin: 0;
        color: #68736b;
      }
      .eyebrow {
        color: #965d6b;
        letter-spacing: 2px;
        font-size: 11px;
        font-weight: 600;
      }
      .version {
        border: 1px solid #d8dfd1;
        border-radius: 99px;
        padding: 6px 12px;
        color: #68736b;
        font-size: 12px;
        background: #fffdf4e6;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid #e4e5d9;
        border-radius: 18px;
        overflow: hidden;
      }
      .hero {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 40px;
        background: radial-gradient(ellipse at 20% 0, #50685b, #2d403d 75%);
        color: #fffaf0;
        grid-row: span 2;
      }
      .hero img {
        width: 178px;
        height: 178px;
      }
      .hero h2 {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.7px;
        margin: 0;
      }
      .hero p {
        font-size: 12px;
        color: #d4decf;
        margin: 4px 0 0;
      }
      .card-head {
        padding: 18px 22px;
        border-bottom: 1px solid #e7eadf;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #68736b;
      }
      .card-head strong {
        color: #3d5143;
        font-weight: 600;
      }
      .scale-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 28px;
        padding: 26px 24px;
      }
      .scale-row figure {
        margin: 0;
        text-align: center;
      }
      .scale-row img {
        display: block;
        margin: auto;
      }
      .scale-row figcaption {
        font-size: 11px;
        color: #68736b;
        margin-top: 12px;
      }
      .marks {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 22px;
        gap: 24px;
      }
      .marks img {
        width: 42px;
        height: 42px;
      }
      .swatches {
        display: flex;
        gap: 7px;
      }
      .swatch {
        width: 29px;
        height: 29px;
        border-radius: 8px;
        border: 1px solid #00000008;
      }
      .art {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 28px 22px;
        min-height: 190px;
      }
      .art img {
        width: 172px;
        height: auto;
      }
      .art h3 {
        font-size: 15px;
        margin: 0 0 7px;
      }
      .art p {
        font-size: 12px;
        color: #68736b;
        margin: 0;
        max-width: 170px;
      }
      footer {
        font-size: 12px;
        color: #68736b;
        margin-top: 25px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      @media (max-width: 900px) {
        main {
          padding: 24px;
        }
        .hero {
          gap: 16px;
          padding: 28px;
          flex-direction: column;
        }
        .hero img {
          width: 140px;
          height: 140px;
        }
        .scale-row {
          gap: 18px;
        }
        .art {
          flex-direction: column;
          text-align: center;
        }
        .art img {
          width: 148px;
        }
      }
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: flex-start;
        }
        .version {
          display: none;
        }
        .hero {
          flex-direction: row;
        }
        footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">ELYSIA / GARDEN LIGHT</span>
          <h1>花间日光 · 品牌资产</h1>
          <p>从两张参考图中提炼白花、叶影、雾蓝织物与温柔日光。</p>
        </div>
        <span class="version">日常灵感 · 矢量标识</span>
      </header>
      <div class="grid">
        <section class="card hero">
          <img src="app-icon.svg" alt="Elysia 花间日光应用图标" />
          <div>
            <h2>Elysia</h2>
            <p>把想法，慢慢做成喜欢的日常。</p>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><strong>应用图标</strong><span>16–256 px · 统一白花</span></div>
          <div class="scale-row">
            <figure>
              <img src="app-icon.svg" width="16" height="16" alt="16 像素" />
              <figcaption>16</figcaption>
            </figure>
            <figure>
              <img src="app-icon.svg" width="24" height="24" alt="24 像素" />
              <figcaption>24</figcaption>
            </figure>
            <figure>
              <img src="app-icon.svg" width="32" height="32" alt="32 像素" />
              <figcaption>32</figcaption>
            </figure>
            <figure>
              <img src="app-icon.svg" width="48" height="48" alt="48 像素" />
              <figcaption>48</figcaption>
            </figure>
            <figure>
              <img src="app-icon.svg" width="64" height="64" alt="64 像素" />
              <figcaption>64</figcaption>
            </figure>
            <figure>
              <img src="app-icon.svg" width="96" height="96" alt="96 像素" />
              <figcaption>96</figcaption>
            </figure>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><strong>白花与庭院配色</strong><span>柔粉 · 灰绿 · 雾蓝</span></div>
          <div class="marks">
            <img src="mark.svg" alt="Elysia 单色标记" />
            <div class="swatches">
              <span class="swatch" style="background: #965d6b" title="#965d6b"></span
              ><span class="swatch" style="background: #e6b4b4" title="#e6b4b4"></span
              ><span class="swatch" style="background: #769182" title="#769182"></span
              ><span class="swatch" style="background: #abc0cd" title="#abc0cd"></span
              ><span class="swatch" style="background: #fbf9f1" title="#fbf9f1"></span>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><strong>花间手记</strong><span>首页 · 预览空状态</span></div>
          <div class="art">
            <img src="workspace-empty.svg" alt="日光下的笔记本、白花与雾蓝花瓶" />
            <div>
              <h3>留一点时间给灵感</h3>
              <p>白花、叶影和一本手记，留出安静思考的空间。</p>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><strong>花束信笺</strong><span>交付列表空状态</span></div>
          <div class="art">
            <img src="delivery-empty.svg" alt="以雾蓝丝带系好的奶油白信笺与花枝" />
            <div>
              <h3>把完成的小事收好</h3>
              <p>用奶油白纸张和雾蓝丝带，收好每一份认真完成的成果。</p>
            </div>
          </div>
        </section>
      </div>
      <footer>
        <span>参考图元素提炼 · SVG 原稿 · PNG 512 px · ICO 9 个尺寸</span><span>Elysia / 本机协作空间</span>
      </footer>
    </main>
  </body>
</html>
