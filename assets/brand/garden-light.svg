<!--
  花园日光横幅：在 720×260 画布叠加日光光晕、叶影、花朵及半透明丝带。局部渐变遮罩使花枝沿画布方向淡出，bloom 路径通过平移、旋转与缩放复用，便于保持花形一致。
  EN: Garden-light banner: layers sunlight, foliage, blooms, and translucent ribbon in a 720×260 viewBox. A gradient mask fades the branches; translated/rotated/scaled bloom instances preserve a consistent flower shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" fill="none">
  <title>白花、叶影与午后日光</title>
  <defs>
    <radialGradient id="sun"><stop stop-color="#fff2c5" stop-opacity=".72"/><stop offset="1" stop-color="#fff7df" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="510" y1="0" x2="465" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<!--
  白到透明的遮罩控制花枝显隐，保持花叶路径本身完整，并使其融入背景而非硬裁切。
  EN: A white-to-transparent mask fades complete foliage paths into the background instead of hard clipping them.
-->
    <mask id="soften"><rect width="720" height="260" fill="url(#fade)"/></mask>
    <path id="bloom" d="M0-18C-11-27-24-16-17-5C-31 0-24 17-11 15C-7 30 11 27 13 15C27 18 32 1 18-6C25-20 10-28 0-18Z" fill="#fffdf5" stroke="#e1d8bc" stroke-width="1.1"/>
  </defs>
  <ellipse cx="474" cy="63" rx="218" ry="151" fill="url(#sun)"/>
  <g mask="url(#soften)">
    <path d="M742-5C670 4 622 50 618 116C614 172 560 206 517 225M641 35C587 35 557 20 527-11" stroke="#a5b599" stroke-width="2"/>
    <path d="M676 18C682 57 663 82 634 86C631 53 647 30 676 18ZM634 80C670 83 691 103 690 131C658 132 638 113 634 80ZM618 123C600 98 573 94 552 104C564 134 589 143 618 123ZM598 170C617 151 645 151 665 168C645 190 620 189 598 170ZM588 37C579 58 558 68 537 62C546 40 566 32 588 37Z" fill="#bdcbb0"/>
    <path d="M716 60C702 38 709 13 729-1M566 208C556 182 534 170 509 175" stroke="#d2dbbf" stroke-width="15" stroke-linecap="round"/>
    <use href="#bloom" transform="translate(653 32) rotate(12) scale(1.18)"/>
    <use href="#bloom" transform="translate(625 149) rotate(-14) scale(.9)"/>
    <use href="#bloom" transform="translate(556 18) scale(.76)"/>
    <circle cx="653" cy="32" r="4" fill="#dccd98"/><circle cx="625" cy="149" r="3" fill="#dccd98"/><circle cx="556" cy="18" r="2.7" fill="#dccd98"/>
    <circle cx="485" cy="80" r="6" fill="#fff8dd"/><circle cx="571" cy="114" r="3" fill="#eeddbc"/>
    <path d="M677 112C648 155 670 184 710 208C682 180 689 151 716 132" fill="#c6d8de" opacity=".55"/>
  </g>
</svg>
