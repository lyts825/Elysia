<!--
  交付空状态插画：在 200×148 坐标中依次绘制背景、花枝、信笺、信封与雾蓝丝带。flower 路径复用于多个花朵，信封渐变提供纸张层次；元素绘制顺序决定遮挡关系，文件不表示交付状态数据。
  EN: Delivery empty-state illustration: layers background, flowers, stationery, envelope, and blue ribbon in a 200×148 viewBox. Reused flower geometry and an envelope gradient provide detail; paint order controls overlap and the asset contains no delivery-state data.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="148" viewBox="0 0 200 148" fill="none">
  <title>白花与系着雾蓝丝带的信笺</title>
  <defs>
    <linearGradient id="envelope" x1="49" y1="75" x2="151" y2="125" gradientUnits="userSpaceOnUse"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#e9dfd4"/></linearGradient>
    <path id="flower" d="M0-5C-3-7-6-4-4-1C-7 0-6 4-3 4C-2 7 2 7 3 4C6 5 8 1 4-1C6-4 3-7 0-5Z" fill="#fffdf4" stroke="#d9cfbb" stroke-width=".8"/>
  </defs>
  <circle cx="101" cy="76" r="57" fill="#f5f5e9"/>
  <ellipse cx="102" cy="132" rx="67" ry="5" fill="#e4e3da" opacity=".6"/>
  <path d="M112 90L145 45M126 90L164 58" stroke="#839b7f" stroke-width="1.5"/>
  <path d="M133 65C121 62 118 52 122 44C133 47 137 55 133 65ZM143 71C148 58 160 55 167 59C162 70 154 74 143 71Z" fill="#91a489"/>
  <path d="M151 50C148 40 152 32 160 29C165 40 160 48 151 50Z" fill="#bdc69e"/>
  <use href="#flower" transform="translate(141 43) scale(1.7)"/>
  <use href="#flower" transform="translate(165 57) scale(1.25)"/>
  <circle cx="141" cy="44" r="2" fill="#d5c08b"/><circle cx="165" cy="58" r="1.5" fill="#d5c08b"/>
