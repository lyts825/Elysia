  <rect x="73" y="30" width="59" height="77" rx="6" transform="rotate(7 73 30)" fill="#dbe4e3" stroke="#b6c8c9" stroke-width="1.3"/>
  <rect x="62" y="29" width="65" height="77" rx="6" fill="#fffdf7" stroke="#c9b8ab" stroke-width="1.5"/>
  <path d="M75 52H108M75 62H113M75 72H102" stroke="#d3c4b6" stroke-width="2.6" stroke-linecap="round"/>
<!--
  信封前片在信纸之后绘制，靠 SVG 绘制顺序形成信纸插入信封的遮挡关系。
  EN: Paints the envelope front after the stationery so SVG paint order creates the inserted-paper overlap.
-->
  <path d="M46 79L100 105L154 79V120A6 6 0 0 1 148 126H52A6 6 0 0 1 46 120Z" fill="url(#envelope)" stroke="#bea7a2" stroke-width="1.4" stroke-linejoin="round"/>
